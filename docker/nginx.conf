# Local-development nginx config. Mirrors the deployment-A/B/C routing in
# ../sealog.conf (the reference production config) minus TLS and file-based
# access logs, which don't apply to a local container. Keep route changes
# here in sync with ../sealog.conf and ../src/config/constants.js per
# docs/ARCHITECTURE.md.
#
# Each deployment proxies to a Sealog Server expected on the *host* machine
# at localhost:8000/8100/8200. From inside the container "localhost" is the
# container itself, so `host.docker.internal` (mapped to the host gateway via
# `extra_hosts` in docker-compose.yml) is used to reach it instead — start
# your Sealog Server instance(s) on the host at those ports before syncing.

upstream sealog_a_upstream {
  server host.docker.internal:8000;
}

upstream sealog_b_upstream {
  server host.docker.internal:8100;
}

upstream sealog_c_upstream {
  server host.docker.internal:8200;
}

server {
  listen 80;
  server_name localhost;
  root /srv/sealog-offline;

  # Landing hub for selecting a deployment.
  location / {
    index landing.html;
    try_files $uri $uri/ /landing.html;
  }

  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
  }

  location = /favicon.ico {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location ^~ /icons/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # ---- Deployment A ----
  location = /sealog-a { return 301 /sealog-a/; }

  location ^~ /sealog-a/debug/asnap-backfill {
    add_header Cache-Control "no-cache";
    if ($request_method = OPTIONS) { return 204; }
    if ($request_method != POST) { return 405; }
    return 204;
  }

  location ^~ /sealog-a/sealog-server/ {
    proxy_pass         http://sealog_a_upstream/sealog-server/;
    proxy_set_header   Host               localhost:8000;
    proxy_set_header   X-Forwarded-Proto  http;
    proxy_set_header   X-Forwarded-Host   $host;
    proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header   X-Request-ID       $request_id;
  }

  location = /sealog-a/sw.js {
    alias /srv/sealog-offline/sw.js;
    add_header Cache-Control "no-cache";
    add_header Service-Worker-Allowed "/sealog-a/";
  }

  location ^~ /sealog-a/ {
    alias /srv/sealog-offline/;
    index index.html;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /sealog-a/index.html;
  }

  # ---- Deployment B ----
  location = /sealog-b { return 301 /sealog-b/; }

  location ^~ /sealog-b/debug/asnap-backfill {
    add_header Cache-Control "no-cache";
    if ($request_method = OPTIONS) { return 204; }
    if ($request_method != POST) { return 405; }
    return 204;
  }

  location ^~ /sealog-b/sealog-server/ {
    proxy_pass         http://sealog_b_upstream/sealog-server/;
    proxy_set_header   Host               localhost:8100;
    proxy_set_header   X-Forwarded-Proto  http;
    proxy_set_header   X-Forwarded-Host   $host;
    proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header   X-Request-ID       $request_id;
  }

  location = /sealog-b/sw.js {
    alias /srv/sealog-offline/sw.js;
    add_header Cache-Control "no-cache";
    add_header Service-Worker-Allowed "/sealog-b/";
  }

  location ^~ /sealog-b/ {
    alias /srv/sealog-offline/;
    index index.html;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /sealog-b/index.html;
  }

  # ---- Deployment C ----
  location = /sealog-c { return 301 /sealog-c/; }

  location ^~ /sealog-c/debug/asnap-backfill {
    add_header Cache-Control "no-cache";
    if ($request_method = OPTIONS) { return 204; }
    if ($request_method != POST) { return 405; }
    return 204;
  }

  location ^~ /sealog-c/sealog-server/ {
    proxy_pass         http://sealog_c_upstream/sealog-server/;
    proxy_set_header   Host               localhost:8200;
    proxy_set_header   X-Forwarded-Proto  http;
    proxy_set_header   X-Forwarded-Host   $host;
    proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header   X-Request-ID       $request_id;
  }

  location = /sealog-c/sw.js {
    alias /srv/sealog-offline/sw.js;
    add_header Cache-Control "no-cache";
    add_header Service-Worker-Allowed "/sealog-c/";
  }

  location ^~ /sealog-c/ {
    alias /srv/sealog-offline/;
    index index.html;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /sealog-c/index.html;
  }
}
