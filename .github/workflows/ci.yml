name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - node-version: current
            npm-version: latest
            label: current
          - node-version: lts/*
            npm-version: bundled
            label: lts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: build ${{ matrix.label }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          check-latest: true
          cache: npm
      - if: ${{ matrix.npm-version == 'latest' }}
        run: npm install -g npm@latest
      - run: node -v && npm -v
      - run: npm ci
      - run: npm audit --include=dev --audit-level=moderate
      - run: npm run icons:check
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run test:dom
      - run: npm run test:integration

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    name: e2e current
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          # Keep browser tests on the Node 24 LTS line for a stable toolchain.
          node-version: 24
          check-latest: true
          cache: npm
      - run: npm install -g npm@latest
      - run: node -v && npm -v
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
