##
# /etc/nginx/conf.d/sealog.conf
# Deployment A/B/C and their routes are generic examples. Customize these
# together with the landing page, app/worker prefixes, and backend addresses.
##

upstream sealog_a_upstream {
  server 203.0.113.40:8000;
}

upstream sealog_b_upstream {
  server 203.0.113.40:8100;
}

upstream sealog_c_upstream {
  server 203.0.113.40:8200;
}

# Access log formats for sync requests and ASNAP snapshots.
log_format sealog_sync_meta escape=json
  '{"ts":"$time_iso8601","request_id":"$request_id","remote_addr":"$remote_addr","host":"$host","method":"$request_method","uri":"$uri","args":"$args","status":$status,"upstream_addr":"$upstream_addr","upstream_status":"$upstream_status","request_time":$request_time,"upstream_response_time":"$upstream_response_time","request_length":$request_length,"bytes_sent":$bytes_sent,"referer":"$http_referer","user_agent":"$http_user_agent"}';

log_format sealog_sync_body escape=json
  '{"ts":"$time_iso8601","request_id":"$request_id","remote_addr":"$remote_addr","method":"$request_method","uri":"$uri","args":"$args","status":$status,"upstream_addr":"$upstream_addr","upstream_status":"$upstream_status","request_time":$request_time,"upstream_response_time":"$upstream_response_time","request_length":$request_length,"bytes_sent":$bytes_sent,"request_body":"$request_body"}';

log_format sealog_asnap_snapshot escape=json
  '{"ts":"$time_iso8601","request_id":"$request_id","remote_addr":"$remote_addr","host":"$host","method":"$request_method","uri":"$uri","status":$status,"request_time":$request_time,"request_length":$request_length,"bytes_sent":$bytes_sent,"referer":"$http_referer","user_agent":"$http_user_agent","request_body":"$request_body"}';

map $uri $sealog_sync_meta_log {
  default 0;
  ~^/sealog-a/sealog-server/ 1;
  ~^/sealog-b/sealog-server/ 1;
  ~^/sealog-c/sealog-server/ 1;
}

map $uri $sealog_sync_body_log {
  default 0;
  ~^/sealog-a/sealog-server/api/v1/(?:events|event_aux_data)(?:/.*)?$ 1;
  ~^/sealog-b/sealog-server/api/v1/(?:events|event_aux_data)(?:/.*)?$ 1;
  ~^/sealog-c/sealog-server/api/v1/(?:events|event_aux_data)(?:/.*)?$ 1;
}

map $uri $sealog_asnap_snapshot_log {
  default 0;
  ~^/sealog-a/debug/asnap-backfill$ 1;
  ~^/sealog-b/debug/asnap-backfill$ 1;
  ~^/sealog-c/debug/asnap-backfill$ 1;
}

server {
  listen      80;
  server_name 203.0.113.10;
  return 301 https://$host$request_uri;
}

server {
  listen              443 ssl http2;
  server_name         203.0.113.10;

  ssl_certificate     /srv/certs/sealog-server-fullchain.crt;
  ssl_certificate_key /srv/certs/sealog-server.key;
  ssl_session_timeout  1d;
  ssl_session_cache    shared:sealogSSL:10m;
  ssl_session_tickets  off;
  ssl_protocols        TLSv1.2 TLSv1.3;
  ssl_ciphers          HIGH:!aNULL:!MD5;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;
  gzip_min_length 256;

  # Sync request and ASNAP snapshot access logs.
  error_log /var/log/nginx/sealog-sync-debug-error.log debug;
  access_log /var/log/nginx/sealog-sync-meta.log sealog_sync_meta if=$sealog_sync_meta_log;
  access_log /var/log/nginx/sealog-sync-events-body.log sealog_sync_body if=$sealog_sync_body_log;
  access_log /var/log/nginx/sealog-asnap-backfill-snapshot.log sealog_asnap_snapshot if=$sealog_asnap_snapshot_log;

  root /srv/sealog-offline;

  # Landing hub for selecting a deployment
  location / {
    index landing.html;
    try_files $uri $uri/ /landing.html;
  }

  # Root-level assets
  location = /manifest.webmanifest {
    alias /srv/sealog-offline/manifest.webmanifest;
    add_header Cache-Control "no-cache";
  }

  location = /favicon.ico {
    alias /srv/sealog-offline/favicon.ico;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location = /apple-touch-icon.png {
    alias /srv/sealog-offline/icons/apple-touch-icon.png;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  #
  # Client-side ASNAP backfill snapshot sink.
  # Accepts same-origin POSTs and logs request bodies to the dedicated snapshot log.
  #
  location = /sealog-a/debug/asnap-backfill {
    add_header Cache-Control "no-cache";
    if ($request_method = OPTIONS) {
      return 204;
    }
    if ($request_method != POST) {
      return 405;
    }
    return 204;
  }

  location = /sealog-b/debug/asnap-backfill {
    add_header Cache-Control "no-cache";
    if ($request_method = OPTIONS) {
      return 204;
    }
    if ($request_method != POST) {
      return 405;
    }
    return 204;
  }

  location = /sealog-c/debug/asnap-backfill {
    add_header Cache-Control "no-cache";
    if ($request_method = OPTIONS) {
      return 204;
    }
    if ($request_method != POST) {
      return 405;
    }
    return 204;
  }

  location ^~ /icons/ {
    alias /srv/sealog-offline/icons/;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # -------------------------
  # Deployment A
  # -------------------------
  location = /sealog-a {
    return 301 /sealog-a/;
  }

  location ^~ /sealog-a/sealog-server/ {
    proxy_pass         http://sealog_a_upstream/sealog-server/;
    proxy_set_header   Host               203.0.113.40:8000;
    proxy_set_header   X-Forwarded-Proto  https;
    proxy_set_header   X-Forwarded-Host   $host;
    proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header   X-Request-ID       $request_id;
  }

  location ^~ /sealog-a/ {
    alias /srv/sealog-offline/;
    index index.html;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /sealog-a/index.html;
  }

  location = /sealog-a/sw.js {
    alias /srv/sealog-offline/sw.js;
    add_header Cache-Control "no-cache";
    add_header Service-Worker-Allowed "/sealog-a/";
  }


  # -------------------------
  # Deployment B
  # -------------------------
  location = /sealog-b {
    return 301 /sealog-b/;
  }

  location ^~ /sealog-b/sealog-server/ {
    proxy_pass         http://sealog_b_upstream/sealog-server/;
    proxy_set_header   Host               203.0.113.40:8100;
    proxy_set_header   X-Forwarded-Proto  https;
    proxy_set_header   X-Forwarded-Host   $host;
    proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header   X-Request-ID       $request_id;
  }

  location ^~ /sealog-b/ {
    alias /srv/sealog-offline/;
    index index.html;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /sealog-b/index.html;
  }

  location = /sealog-b/sw.js {
    alias /srv/sealog-offline/sw.js;
    add_header Cache-Control "no-cache";
    add_header Service-Worker-Allowed "/sealog-b/";
  }


  # -------------------------
  # Deployment C
  # -------------------------
  location = /sealog-c {
    return 301 /sealog-c/;
  }

  location ^~ /sealog-c/sealog-server/ {
    proxy_pass         http://sealog_c_upstream/sealog-server/;
    proxy_set_header   Host               203.0.113.40:8200;
    proxy_set_header   X-Forwarded-Proto  https;
    proxy_set_header   X-Forwarded-Host   $host;
    proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header   X-Request-ID       $request_id;
  }

  location ^~ /sealog-c/ {
    alias /srv/sealog-offline/;
    index index.html;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /sealog-c/index.html;
  }

  location = /sealog-c/sw.js {
    alias /srv/sealog-offline/sw.js;
    add_header Cache-Control "no-cache";
    add_header Service-Worker-Allowed "/sealog-c/";
  }

}
